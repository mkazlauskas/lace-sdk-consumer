<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>lace-sdk consumer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { display: flex; flex-direction: column; }
      pre { white-space: pre-wrap; word-break: break-all; margin: 0; }
    </style>
  </head>
  <body>
    <div id="main" style="flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;">
      <pre id="out"></pre>
      <pre id="address-output"></pre>
      <p>Cardano Preprod only. This demo uses an unpublished SDK tarball; final evidence needs a published prerelease. No recovery phrase export.</p>
      <p>First signup asks twice: create passkey, then approve a PRF assertion. Keep the same passkey available on other devices.</p>
      <button id="create-passkey" hidden>Create passkey wallet</button>
      <button id="open-passkey" hidden>Open passkey wallet</button>
      <button id="build-tx" disabled>Build Transaction</button>
      <pre id="tx-review" hidden></pre>
      <label><input id="review-confirm" type="checkbox" /> I reviewed the Preprod transaction and recipient</label>
      <button id="sign-tx" disabled>Sign Transaction</button>
      <button id="submit-tx" disabled>Submit Transaction</button>
      <pre id="tx-output"></pre>
      <pre id="tokens-output"></pre>
    </div>
    <div id="state-output" style="flex:1;overflow:auto;background:#111;color:#0f0;font-family:monospace;font-size:12px;padding:8px;white-space:pre-wrap;display:none;"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
